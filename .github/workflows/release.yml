name: Build release installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
      - run: npm ci
      - run: npm test
      - name: Build native components
        shell: pwsh
        run: |
          ./scripts/build-enhancements.ps1 -SkipTests
          cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir native/build -C Release --output-on-failure -R "^native-(core|telemetry|control|input|helmet-math|stream-helmet|inactive-paths|lmu|layer-registry|color-control|color-cli|desktop-interaction|overlay-protocol|internal-ui)"
          exit $LASTEXITCODE
      - run: npm run package:installer
      - name: Check packaged module settings and helmet visor states
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $env:OPENGRIDXR_TEST_EXE = (Resolve-Path "release/$version/win-unpacked/OpenGrid XR.exe").Path
          npm run test:modules-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:visor-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:lmu-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/lmu-diagnostics-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:layers-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:input-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:placement-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:stream-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:support-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/quick-menu-editor-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/quick-menu-renderer-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/color-correction-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/full-visor-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/visor-template-export.cjs
          exit $LASTEXITCODE
      - run: npm run test:update-download
      - name: Create draft release with updater metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $files = Get-ChildItem "release/$version" -File | Where-Object { $_.Name -match '\.exe$|\.blockmap$|^latest\.yml$' }
          if ($files.Count -lt 3) { throw 'Installer, blockmap and latest.yml are required.' }
          # A locally signed release may already have been published for this tag.
          # Preserve its assets instead of creating a second, unsigned draft.
          gh release view $env:GITHUB_REF_NAME --json id --jq .id *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; keeping its assets unchanged.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "OpenGrid XR $version" --generate-notes @($files.FullName)
          exit $LASTEXITCODE
