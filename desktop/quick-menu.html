<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>OpenGrid menu</title>
<link rel="stylesheet" href="quick-menu.css">
<script defer src="quick-menu.js"></script>
</head>
<body>
<main>
<header><div><p class="eyebrow">OPENGRID XR · LIVE CONTROLS</p><h1>OpenGrid menu</h1><p id="profile">Waiting for saved profile…</p></div><span class="vr-only">VR ONLY</span></header>
<div class="instruction">Point with your head · Press your select key or bound controller button</div>
<div id="actions" class="actions" aria-label="Live controls"></div>
<nav aria-label="Control pages"><button id="previous" aria-label="Previous controls">← Previous</button><span id="page-number"></span><button id="next" aria-label="Next controls">Next →</button></nav>
<footer><p id="status" role="status" aria-live="polite">Connecting to local controls…</p><button id="close" data-action="close" aria-label="Close menu" disabled>Close menu</button></footer>
</main>
<div id="head-cursor" aria-hidden="true" hidden></div>
</body>
</html>
